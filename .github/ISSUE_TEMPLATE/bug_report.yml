name: Bug report
description: Something in Beam is broken or behaves unexpectedly.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Beam runs per-user with no admin rights, so most bugs
        reproduce on a single machine. The more of the checklist below you can fill in,
        the faster we can fix it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Plug in display / open tray menu / run `beam status`
        2. …
    validations:
      required: true
  - type: textarea
    id: cli-output
    attributes:
      label: CLI output
      description: Output of `beam status` and, if relevant, `beam status --json`. Paste between code fences.
      render: shell
  - type: textarea
    id: log
    attributes:
      label: Log tail
      description: Last ~30 lines of `%LOCALAPPDATA%\Beam\beam.log` (or `beam-detailed.jsonl`).
      render: shell
  - type: input
    id: version
    attributes:
      label: Beam version
      placeholder: "0.1.1 (from `beam help --json`)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 26H2, build 26300"
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Connected displays
      description: How many, internal panel resolution, external make/model + native resolution, topology (mirror/extend). "No external display connected" is a valid answer — that path is tested too.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and didn't find this reported
          required: true
        - label: I can still reproduce it on the latest `snapshot` build
          required: false
