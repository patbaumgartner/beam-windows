**Is your feature request related to a problem?**
A clear and concise description of what the problem is. Ex. *"When I present on a 16:10
laptop the text is tiny…"*

**Describe the solution you'd like**
A clear and concise description of what you want to happen.

**Describe alternatives you've considered**
A clear and concise description of any alternative solutions or features you've considered.

**Additional context**
Add any other context or screenshots here. Note: Beam's engine is being donated to
PowerToys, so APIs must stay inside `Beam.Core` with no Windows dependency.
