name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.2)'
        required: true
        default: 'v0.3.2'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build release artifacts
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore and verify quality gates
        run: |
          dotnet restore Beam.sln
          dotnet format Beam.sln --verify-no-changes --no-restore
          dotnet build Beam.sln -c Release --no-restore
          dotnet test Beam.sln -c Release --no-build --collect:"XPlat Code Coverage"
          ./eng/coverage.ps1 -NoTest -Enforce
          ./eng/mutation-test.ps1 -MaxMutants 50
          ./eng/check-links.ps1

      - name: Resolve version and verify tag provenance
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '${{ inputs.tag }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw "Invalid release tag: $tag" }
          $head = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-parse "$tag^{}").Trim()
          if ($head -ne $tagCommit) { throw "Checked out $head, but $tag points at $tagCommit" }
          $v = $tag.TrimStart('v')
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained tray
        run: dotnet publish src/Beam.Tray -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }} -o src/Beam.Tray/bin/Release/net10.0-windows/publish

      - name: Publish self-contained CLI
        run: dotnet publish src/Beam.Cli -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }} -o src/Beam.Cli/bin/Release/net10.0-windows/publish

      # No code signing anywhere (ADR-0016): artifacts ship unsigned, integrity is
      # provided by SHA256SUMS.txt attached to the release.
      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          Set-StrictMode -Version 2.0

          # Download Inno Setup from the official GitHub immutable release — the
          # files.jrsoftware.org mirror 404s on the runner and choco is flaky.
          $innoUrl  = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe'
          $tarFile  = "$env:TEMP\innosetup-7.1.1-x64.exe"
          $innoDir  = "$env:TEMP\InnoSetup711"
          $isccPath = "$innoDir\ISCC.exe"

          if (-not (Test-Path $isccPath)) {
            Write-Host "Downloading Inno Setup…"
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest -Uri $innoUrl -OutFile $tarFile -UseBasicParsing
            Write-Host "Extracting Inno Setup…"
            New-Item -ItemType Directory -Force -Path $innoDir | Out-Null
            Start-Process -FilePath $tarFile -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$innoDir`"" -Wait -NoNewWindow
            if (-not (Test-Path $isccPath)) { throw "ISCC.exe not found after extraction: $isccPath" }
          }

          Write-Host "ISCC: $isccPath"
          & $isccPath "/DMyAppVersion=${{ steps.version.outputs.version }}" /DOutputDir="$PWD\nightly" installer\Beam.iss

      - name: Package portable zip + SHA256SUMS
        shell: pwsh
        run: .\eng\package-snapshot.ps1 -Version ${{ steps.version.outputs.version }} -OutputDir "$PWD\nightly"

      - name: Locate installer
        id: loc
        shell: pwsh
        run: |
          $f = Get-ChildItem nightly\BeamSetup-*.exe | Select-Object -First 1
          Write-Output "path=$($f.FullName)" >> $env:GITHUB_OUTPUT
          Write-Output "name=$($f.Name)" >> $env:GITHUB_OUTPUT

      - name: Create/update GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ format('Beam {0}', steps.version.outputs.tag) }}
          prerelease: false
          files: |
            ${{ steps.loc.outputs.path }}
            nightly\beam-${{ steps.version.outputs.version }}-portable.zip
            nightly\SHA256SUMS.txt
          generate_release_notes: true
