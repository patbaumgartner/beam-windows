name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build release installer
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '${{ inputs.tag }}' }
          $v = $tag.TrimStart('v')
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish tray
        run: dotnet publish src/Beam.Tray -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Publish CLI
        run: dotnet publish src/Beam.Cli -c Release -p:Version=${{ steps.version.outputs.version }}

      # Signing is optional while the AZURE_* secrets are not configured. Without them
      # the tag release ships as an unsigned snapshot (marked prerelease), per ADR-0016.
      # Once the secrets exist, the binaries are signed BEFORE packaging so the installer
      # embeds signed files, and the Verify gate below fails the release on unsigned output.
      - name: Sign binaries (skipped while AZURE_* secrets are unset)
        id: sign
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $exes = @(
            "src\Beam.Tray\bin\Release\net10.0-windows\publish\Beam.exe",
            "src\Beam.Cli\bin\Release\net10.0-windows\publish\Beam.Cli.exe"
          )
          if ($env:AZURE_TENANT_ID -and $env:AZURE_CLIENT_ID -and $env:AZURE_CLIENT_SECRET) {
            dotnet tool install --global AzureSignTool
            .\installer\sign.ps1 -Mode AzureTrustedSigning -Files $exes `
              -TenantId $env:AZURE_TENANT_ID -ClientId $env:AZURE_CLIENT_ID -ClientSecret $env:AZURE_CLIENT_SECRET
            "signed=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "AZURE_TENANT_ID/AZURE_CLIENT_ID/AZURE_CLIENT_SECRET not set - shipping UNSIGNED snapshot release (ADR-0016)."
            "signed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          Set-StrictMode -Version 2.0

          # Download Inno Setup from the official GitHub immutable release — the
          # files.jrsoftware.org mirror 404s on the runner and choco is flaky.
          $innoUrl  = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe'
          $tarFile  = "$env:TEMP\innosetup-7.1.1-x64.exe"
          $innoDir  = "$env:TEMP\InnoSetup711"
          $isccPath = "$innoDir\ISCC.exe"

          if (-not (Test-Path $isccPath)) {
            Write-Host "Downloading Inno Setup…"
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest -Uri $innoUrl -OutFile $tarFile -UseBasicParsing
            Write-Host "Extracting Inno Setup…"
            New-Item -ItemType Directory -Force -Path $innoDir | Out-Null
            Start-Process -FilePath $tarFile -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$innoDir`"" -Wait -NoNewWindow
            if (-not (Test-Path $isccPath)) { throw "ISCC.exe not found after extraction: $isccPath" }
          }

          Write-Host "ISCC: $isccPath"
          & $isccPath "/DMyAppVersion=${{ steps.version.outputs.version }}" /DOutputDir="$PWD\nightly" installer\Beam.iss

      - name: Sign installer (only when signing is enabled)
        if: steps.sign.outputs.signed == 'true'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $installer = (Get-Item nightly\BeamSetup-*.exe).FullName
          .\installer\sign.ps1 -Mode AzureTrustedSigning -Files @($installer) `
            -TenantId $env:AZURE_TENANT_ID -ClientId $env:AZURE_CLIENT_ID -ClientSecret $env:AZURE_CLIENT_SECRET

      - name: Package portable snapshot + SHA256SUMS
        shell: pwsh
        run: .\eng\package-snapshot.ps1 -Version ${{ steps.version.outputs.version }} -OutputDir "$PWD\nightly"

      - name: Verify signatures (gate, only when signed)
        if: steps.sign.outputs.signed == 'true'
        shell: pwsh
        run: |
          $files = @((Get-Item nightly\BeamSetup-*.exe).FullName) + @(
            "src\Beam.Tray\bin\Release\net10.0-windows\publish\Beam.exe",
            "src\Beam.Cli\bin\Release\net10.0-windows\publish\Beam.Cli.exe"
          )
          .\installer\sign.ps1 -Mode Verify -Files $files

      - name: Locate installer
        id: loc
        shell: pwsh
        run: |
          $f = Get-ChildItem nightly\BeamSetup-*.exe | Select-Object -First 1
          Write-Output "path=$($f.FullName)" >> $env:GITHUB_OUTPUT
          Write-Output "name=$($f.Name)" >> $env:GITHUB_OUTPUT

      - name: Create/update GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.sign.outputs.signed == 'true' && format('Beam {0}', steps.version.outputs.tag) || format('Beam {0} (unsigned snapshot)', steps.version.outputs.tag) }}
          # Unsigned builds are published as prereleases until signing is enabled (ADR-0016).
          prerelease: ${{ steps.sign.outputs.signed != 'true' }}
          files: |
            ${{ steps.loc.outputs.path }}
            nightly\beam-${{ steps.version.outputs.version }}-portable.zip
            nightly\SHA256SUMS.txt
          generate_release_notes: true
