name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep permissions read-only for the default token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore Beam.sln

      - name: Build
        run: dotnet build Beam.sln --configuration ${{ matrix.configuration }} --no-restore

      - name: Test
        run: dotnet test Beam.sln --configuration ${{ matrix.configuration }} --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.configuration }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.configuration }}
          path: '**/TestResults/**/coverage.cobertura.xml'
          if-no-files-found: warn

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    steps:
      - name: Download coverage (Debug)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-Debug
          path: coverage-debug
        continue-on-error: true
      - name: Download coverage (Release)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-Release
          path: coverage-release
        continue-on-error: true
      - name: Check coverage thresholds
        shell: pwsh
        run: |
          # Only Bean.Core is the pure domain worth gating on; Beam.Tray/Beam.Windows
          # are UI + native P/Invoke shells (14% and would drag the merged number down).
          $reports = Get-ChildItem -Recurse -Filter coverage.cobertura.xml . -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Beam.Core.Tests' }
          if ($reports.Count -eq 0) { Write-Host "::error::No Beam.Core coverage report found"; exit 1 }
          $lc = 0; $lv = 0; $bc = 0; $bv = 0
          foreach ($r in $reports) { [xml]$x = Get-Content $r.FullName; $c = $x.coverage; $lc += [int]$c.'lines-covered'; $lv += [int]$c.'lines-valid'; $bc += [int]$c.'branches-covered'; $bv += [int]$c.'branches-valid' }
          $lp = if ($lv -gt 0) { [math]::Round(100 * $lc / $lv, 1) } else { 0 }
          $bp = if ($bv -gt 0) { [math]::Round(100 * $bc / $bv, 1) } else { 0 }
          Write-Host "Beam.Core coverage: $lp% line, $bp% branch (baseline 81% -> gate at 75%)"
          if ($lp -lt 75) { Write-Host "::error::Beam.Core line coverage $lp% below gate (75%)"; exit 1 }

  snapshot:
    name: Snapshot installer (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Publish tray
        run: dotnet publish src/Beam.Tray -c Release

      - name: Publish CLI
        run: dotnet publish src/Beam.Cli -c Release

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          Set-StrictMode -Version 2.0

          # Download Inno Setup from the official GitHub immutable release â€” the
          # files.jrsoftware.org mirror 404s on the runner and choco is flaky.
          $innoUrl  = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe'
          $tarFile  = "$env:TEMP\innosetup-7.1.1-x64.exe"
          $innoDir  = "$env:TEMP\InnoSetup711"
          $isccPath = "$innoDir\ISCC.exe"

          if (-not (Test-Path $isccPath)) {
            Write-Host "Downloading Inno Setupâ€¦"
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest -Uri $innoUrl -OutFile $tarFile -UseBasicParsing
            Write-Host "Extracting Inno Setupâ€¦"
            New-Item -ItemType Directory -Force -Path $innoDir | Out-Null
            Start-Process -FilePath $tarFile -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$innoDir`"" -Wait -NoNewWindow
            if (-not (Test-Path $isccPath)) { throw "ISCC.exe not found after extraction: $isccPath" }
          }

          Write-Host "ISCC: $isccPath"
          & "$isccPath" /DOutputDir="$PWD\nightly" installer\Beam.iss

      - name: List installer output
        shell: pwsh
        run: Get-ChildItem nightly | Select-Object Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beam-snapshot-installer
          path: nightly/BeamSetup-*.exe
          if-no-files-found: error

  # â”€â”€ Snapshot GitHub Release â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Every push to main publishes an updated "latest snapshot" release so the
  # most-recent installer is always one click away from the Releases page.
  snapshot-release:
    name: Snapshot GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: snapshot
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: beam-snapshot-installer
          path: installer

      - name: List downloaded artifact
        run: ls -lh installer/

      - name: Locate installer
        id: loc
        run: |
          f=$(ls installer/BeamSetup-*.exe | head -n 1)
          echo "path=$f" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$f")" >> "$GITHUB_OUTPUT"

      - name: Create/update snapshot release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: snapshot
          name: Beam snapshot (latest main build)
          body: |
            Automated snapshot installer built from the latest `main` branch push.

            Install it to get the latest fixes while a stable release is being prepared.
          files: ${{ steps.loc.outputs.path }}
          target_commitish: ${{ github.sha }}
          recreate: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
