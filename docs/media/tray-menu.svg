<svg xmlns="http://www.w3.org/2000/svg" width="420" height="472" viewBox="0 0 420 472" font-family="Segoe UI, sans-serif">
  <!-- Desktop backdrop -->
  <rect width="420" height="472" fill="#3b6ea5"/>
  <rect x="0" y="430" width="420" height="42" fill="#1f1f1f"/>
  <!-- Taskbar corner: clock + tray icon -->
  <text x="352" y="456" fill="#ffffff" font-size="12" text-anchor="end">17:42</text>
  <text x="318" y="456" fill="#ffffff" font-size="12" text-anchor="end">07.11.2026</text>
  <g transform="translate(28,436)">
    <rect width="30" height="30" rx="6" fill="#2b2b2b" stroke="#4a4a4a"/>
    <!-- brand mark: high-beam headlight, mini render of src/Beam.Tray/Assets/high-beam.svg -->
    <g transform="translate(15 15) scale(0.052) translate(-255.5 -255.5)">
      <g fill="#0080B4" transform="translate(255.5 255.5) scale(1.1) translate(-255.5 -255.5)">
        <rect x="151" y="182" width="63" height="20" rx="10"/>
        <rect x="151" y="214" width="55" height="20" rx="10"/>
        <rect x="151" y="246" width="55" height="20" rx="10"/>
        <rect x="151" y="278" width="55" height="20" rx="10"/>
        <rect x="151" y="310" width="63" height="20" rx="10"/>
        <path fill-rule="evenodd" d="M 289 184 A 71.5 71.5 0 1 0 289 327 A 71.5 71.5 0 1 0 289 184 Z M 289 205.5 A 50 50 0 1 1 289 305.5 A 50 50 0 1 1 289 205.5 Z"/>
      </g>
      <g fill="#00AED8">
        <rect x="151" y="182" width="63" height="20" rx="10"/>
        <rect x="151" y="214" width="55" height="20" rx="10"/>
        <rect x="151" y="246" width="55" height="20" rx="10"/>
        <rect x="151" y="278" width="55" height="20" rx="10"/>
        <rect x="151" y="310" width="63" height="20" rx="10"/>
        <path fill-rule="evenodd" d="M 289 184 A 71.5 71.5 0 1 0 289 327 A 71.5 71.5 0 1 0 289 184 Z M 289 205.5 A 50 50 0 1 1 289 305.5 A 50 50 0 1 1 289 205.5 Z"/>
      </g>
    </g>
  </g>

  <!-- Flyout menu — mirrors TrayService.BuildMenu exactly, while a fix is active
       (status "Presenting": Apply disabled, Undo enabled) -->
  <g>
    <rect x="150" y="10" width="258" height="386" rx="8" fill="#2b2b2b" stroke="#3d3d3d"/>
    <!-- header -->
    <text x="166" y="40" fill="#9a9a9a" font-size="13" font-weight="600">Beam 0.1.1</text>
    <line x1="158" y1="52" x2="400" y2="52" stroke="#3d3d3d"/>
    <!-- status -->
    <text x="166" y="76" fill="#7cb7ff" font-size="13" font-weight="600">Presenting</text>
    <line x1="158" y1="94" x2="400" y2="94" stroke="#3d3d3d"/>
    <!-- pause -->
    <text x="166" y="132" fill="#ffffff" font-size="13">Pause Beam</text>
    <!-- startup toggle (checked) -->
    <text x="166" y="166" fill="#ffffff" font-size="13">Launch at sign-in</text>
    <path d="M382 158 l4 5 7 -9" stroke="#7cb7ff" stroke-width="2" fill="none"/>
    <!-- settings submenu -->
    <text x="166" y="200" fill="#ffffff" font-size="13">Settings</text>
    <text x="384" y="200" fill="#8f8f8f" font-size="13">▸</text>
    <line x1="158" y1="224" x2="400" y2="224" stroke="#3d3d3d"/>
    <!-- apply: disabled while a fix is already active (CanApplyNow = idle only) -->
    <text x="166" y="254" fill="#6f6f6f" font-size="13">Apply projector mode now</text>
    <!-- undo: enabled while presenting (CanUndo = active only) -->
    <rect x="158" y="268" width="242" height="30" rx="4" fill="#333333"/>
    <text x="166" y="288" fill="#ffffff" font-size="13">Undo projector mode</text>
    <line x1="158" y1="312" x2="400" y2="312" stroke="#3d3d3d"/>
    <!-- open log folder -->
    <text x="166" y="336" fill="#ffffff" font-size="13">Open log folder</text>
    <line x1="158" y1="350" x2="400" y2="350" stroke="#3d3d3d"/>
    <!-- exit -->
    <text x="166" y="374" fill="#ffffff" font-size="13">Exit Beam</text>

    <!-- annotation callouts -->
    <g font-size="10" fill="#1f1f1f">
      <line x1="400" y1="254" x2="412" y2="254" stroke="#1f1f1f"/>
      <line x1="400" y1="288" x2="412" y2="288" stroke="#1f1f1f"/>
    </g>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#ffffff">
    <rect x="10" y="10" width="130" height="86" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="20" y="30" fill="#1f1f1f" font-weight="600">Contextual menu</text>
    <circle cx="26" cy="44" r="3" fill="#2f9e44"/><text x="36" y="48" fill="#1f1f1f">enabled: action available</text>
    <circle cx="26" cy="62" r="3" fill="#c92a2a"/><text x="36" y="66" fill="#1f1f1f">disabled: would be a dead click</text>
    <circle cx="26" cy="80" r="3" fill="#1971c2"/><text x="36" y="84" fill="#1f1f1f">status line mirrors session</text>
  </g>
</svg>
