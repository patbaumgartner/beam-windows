<svg xmlns="http://www.w3.org/2000/svg" width="420" height="472" viewBox="0 0 420 472" font-family="Segoe UI, sans-serif">
  <!-- Desktop backdrop -->
  <rect width="420" height="472" fill="#3b6ea5"/>
  <rect x="0" y="430" width="420" height="42" fill="#1f1f1f"/>
  <!-- Taskbar corner: clock + tray icon -->
  <text x="352" y="456" fill="#ffffff" font-size="12" text-anchor="end">17:42</text>
  <text x="318" y="456" fill="#ffffff" font-size="12" text-anchor="end">07.11.2026</text>
  <g transform="translate(28,436)">
    <rect width="30" height="30" rx="6" fill="#2b2b2b" stroke="#4a4a4a"/>
    <!-- beam glyph: projector beam -->
    <path d="M8 21 L15 8 L22 21 Z" fill="#7cb7ff"/>
    <circle cx="15" cy="22" r="3.2" fill="#e8f1fb"/>
  </g>

  <!-- Flyout menu -->
  <g>
    <rect x="150" y="10" width="258" height="408" rx="8" fill="#2b2b2b" stroke="#3d3d3d"/>
    <!-- header -->
    <text x="166" y="40" fill="#9a9a9a" font-size="13" font-weight="600">Beam 0.1.1</text>
    <line x1="158" y1="52" x2="400" y2="52" stroke="#3d3d3d"/>
    <!-- status -->
    <text x="166" y="76" fill="#7cb7ff" font-size="13" font-weight="600">Presenting</text>
    <text x="166" y="94" fill="#8f8f8f" font-size="11">Laptop → DELL U2720Q · 16:9 · 200%</text>
    <line x1="158" y1="106" x2="400" y2="106" stroke="#3d3d3d"/>
    <!-- enabled item -->
    <rect x="158" y="114" width="242" height="30" rx="4" fill="#333333"/>
    <text x="166" y="134" fill="#ffffff" font-size="13">Apply projector mode now</text>
    <!-- disabled item -->
    <text x="166" y="168" fill="#6f6f6f" font-size="13">Restore display</text>
    <text x="166" y="202" fill="#ffffff" font-size="13">Pause Beam</text>
    <line x1="158" y1="218" x2="400" y2="218" stroke="#3d3d3d"/>
    <text x="166" y="240" fill="#ffffff" font-size="13">Open log folder</text>
    <!-- checked item -->
    <text x="166" y="274" fill="#ffffff" font-size="13">Run at sign-in</text>
    <path d="M382 266 l4 5 7 -9" stroke="#7cb7ff" stroke-width="2" fill="none"/>
    <text x="166" y="308" fill="#ffffff" font-size="13">About Beam</text>
    <line x1="158" y1="322" x2="400" y2="322" stroke="#3d3d3d"/>
    <text x="166" y="344" fill="#ffffff" font-size="13">Exit Beam</text>

    <!-- annotation callouts -->
    <g font-size="10" fill="#1f1f1f">
      <line x1="400" y1="129" x2="412" y2="129" stroke="#1f1f1f"/>
      <line x1="400" y1="163" x2="412" y2="163" stroke="#1f1f1f"/>
      <rect x="266" y="122" width="0" height="0"/>
    </g>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#ffffff">
    <rect x="10" y="10" width="130" height="86" rx="6" fill="#ffffff" opacity="0.92"/>
    <text x="20" y="30" fill="#1f1f1f" font-weight="600">Contextual menu</text>
    <circle cx="26" cy="44" r="3" fill="#2f9e44"/><text x="36" y="48" fill="#1f1f1f">enabled: action available</text>
    <circle cx="26" cy="62" r="3" fill="#c92a2a"/><text x="36" y="66" fill="#1f1f1f">disabled: would be a dead click</text>
    <circle cx="26" cy="80" r="3" fill="#1971c2"/><text x="36" y="84" fill="#1f1f1f">status line mirrors session</text>
  </g>
</svg>
