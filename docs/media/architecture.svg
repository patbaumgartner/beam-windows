<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7a"/>
    </marker>
  </defs>
  <rect width="760" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2933">Beam architecture</text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#5b6b7a">dependencies point downward — Core depends on nothing</text>

  <!-- Composition roots row -->
  <g>
    <rect x="40" y="90" width="200" height="64" rx="10" fill="#e7f0fb" stroke="#2f6fab" stroke-width="1.5"/>
    <text x="140" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">Beam.Tray</text>
    <text x="140" y="138" text-anchor="middle" font-size="11" fill="#5b6b7a">tray app (WinForms)</text>

    <rect x="280" y="90" width="200" height="64" rx="10" fill="#e7f0fb" stroke="#2f6fab" stroke-width="1.5"/>
    <text x="380" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">Beam.Cli</text>
    <text x="380" y="138" text-anchor="middle" font-size="11" fill="#5b6b7a">scripting &amp; CI (console)</text>

    <rect x="520" y="90" width="200" height="64" rx="10" fill="#e7f0fb" stroke="#2f6fab" stroke-width="1.5"/>
    <text x="620" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">Beam.Windows</text>
    <text x="620" y="138" text-anchor="middle" font-size="11" fill="#5b6b7a">Win32 adapters (CCD, DPI)</text>
  </g>

  <!-- Arrows down to App -->
  <line x1="140" y1="154" x2="140" y2="210" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="154" x2="380" y2="210" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="154" x2="620" y2="210" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- App layer -->
  <rect x="180" y="210" width="400" height="120" rx="10" fill="#fdf3e3" stroke="#b7791f" stroke-width="1.5"/>
  <text x="380" y="236" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">Beam.App</text>
  <text x="380" y="254" text-anchor="middle" font-size="11" fill="#5b6b7a">orchestration via ports — net10.0, no Windows types</text>
  <g font-size="11" fill="#1f2933">
    <rect x="200" y="270" width="110" height="40" rx="6" fill="#ffffff" stroke="#d3a94e"/>
    <text x="255" y="294" text-anchor="middle">SessionManager</text>
    <rect x="325" y="270" width="110" height="40" rx="6" fill="#ffffff" stroke="#d3a94e"/>
    <text x="380" y="294" text-anchor="middle">PresentationManager</text>
    <rect x="450" y="270" width="110" height="40" rx="6" fill="#ffffff" stroke="#d3a94e"/>
    <text x="505" y="294" text-anchor="middle">JournalStore</text>
  </g>

  <!-- Arrow down to Core -->
  <line x1="380" y1="330" x2="380" y2="386" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Core layer -->
  <rect x="120" y="386" width="520" height="130" rx="10" fill="#e9f7ef" stroke="#2f855a" stroke-width="1.5"/>
  <text x="380" y="412" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">Beam.Core — the domain</text>
  <text x="380" y="430" text-anchor="middle" font-size="11" fill="#5b6b7a">net10.0 · pure C# · no P/Invoke, no WinForms</text>
  <g font-size="11" fill="#1f2933">
    <rect x="140" y="446" width="110" height="40" rx="6" fill="#ffffff" stroke="#68a97e"/>
    <text x="195" y="464" text-anchor="middle">Display topology</text>
    <text x="195" y="478" text-anchor="middle">aspect · trigger</text>
    <rect x="265" y="446" width="110" height="40" rx="6" fill="#ffffff" stroke="#68a97e"/>
    <text x="320" y="464" text-anchor="middle">DPI ladder</text>
    <text x="320" y="478" text-anchor="middle">scale planner</text>
    <rect x="390" y="446" width="110" height="40" rx="6" fill="#ffffff" stroke="#68a97e"/>
    <text x="445" y="464" text-anchor="middle">Night Light</text>
    <text x="445" y="478" text-anchor="middle">blob codec</text>
    <rect x="515" y="446" width="105" height="40" rx="6" fill="#ffffff" stroke="#68a97e"/>
    <text x="567" y="464" text-anchor="middle">Ports</text>
    <text x="567" y="478" text-anchor="middle">(interfaces)</text>
  </g>

  <!-- Legend -->
  <g font-size="11">
    <rect x="40" y="240" width="110" height="58" rx="6" fill="#f5f5f5" stroke="#dddddd"/>
    <text x="95" y="262" text-anchor="middle" fill="#1f2933" font-weight="600">5 projects</text>
    <text x="95" y="280" text-anchor="middle" fill="#5b6b7a">decoupled by</text>
    <text x="95" y="290" text-anchor="middle" fill="#5b6b7a">architecture tests</text>
  </g>
</svg>
